<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elena Alexis</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Hablamos? 💙">
<meta property="og:title" content="Elena Alexis">
<meta property="og:description" content="Hablamos? 💙">
<meta property="og:image" content="foto.jpg">
<meta name="theme-color" content="#1a0609">
<link rel="icon" href="foto.jpg">
<link rel="preload" as="image" href="fondo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --vino:#1a0609;
    --rojo-claro:#ff5a6e;
    --oro:#f4c98a;
    --crema:#fff3ea;
    --suave:rgba(255,236,224,.75);
    --cristal:rgba(40,8,14,.42);
    --borde:rgba(255,220,200,.18);
    --verde:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--vino)}
  body{
    font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--crema);
    min-height:100dvh;display:flex;justify-content:center;
    padding:56px 16px calc(36px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  /* Fondo: tu foto difuminada en toda la página */
  .fondo{position:fixed;inset:-20px;z-index:-3;
    background:url(fondo.jpg) center/cover no-repeat;
    filter:blur(2px) saturate(1.15) brightness(.95);transform:scale(1.05);animation:fondoEntra 2.5s ease-out both}
  @keyframes fondoEntra{from{transform:scale(1.18);filter:blur(0) saturate(1.15) brightness(1.05)}to{transform:scale(1.05)}}
  .velo{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(80% 50% at 50% 0%, rgba(244,201,138,.18), transparent 70%),
      linear-gradient(180deg, rgba(40,12,16,.30) 0%, rgba(30,8,12,.42) 50%, rgba(20,5,8,.78) 100%)}
  /* Corazones flotando */
  .corazones{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .corazones span{position:absolute;bottom:-40px;color:var(--rojo-claro);opacity:0;animation:subir linear infinite}
  @keyframes subir{
    0%{transform:translateY(0) rotate(-8deg);opacity:0}
    15%{opacity:.35} 85%{opacity:.25}
    100%{transform:translateY(-110vh) rotate(10deg);opacity:0}
  }

  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}

  /* Foto de perfil con aro brillante */
  .aro{position:relative;width:124px;height:124px;border-radius:50%;padding:3px;
    background:conic-gradient(from 0deg,var(--oro),var(--rojo-claro),#c4213a,var(--oro));
    animation:girar 8s linear infinite;box-shadow:0 0 40px rgba(255,90,110,.35)}
  .aro img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%;
    border:3px solid var(--vino);animation:girar 8s linear infinite reverse}
  @keyframes girar{to{transform:rotate(360deg)}}

  h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;
    font-size:2.3rem;margin-top:20px;letter-spacing:.3px;
    background:linear-gradient(90deg,var(--crema),var(--oro),var(--crema));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .estado{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:10px;font-size:.85rem;font-weight:600}
  .estado span{display:inline-flex;align-items:center;gap:6px}
  .estado svg{width:14px;height:14px}
  .punto{width:9px;height:9px;border-radius:50%;background:var(--verde);animation:latido 2s infinite}
  @keyframes latido{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

  .frase{font-size:1.05rem;margin-top:14px}

  .enlaces{list-style:none;width:100%;margin-top:30px;display:flex;flex-direction:column;gap:14px}

  /* Botón principal: del tamaño del de Mathilde, con tu foto de fondo */
  .principal{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 22px;
    width:100%;height:130px;border-radius:22px;color:#fff;text-decoration:none;
    background:#2a0a10 50% 63%/cover no-repeat;box-shadow:0 12px 40px rgba(0,0,0,.45);
    border:1px solid rgba(255,220,200,.25);transition:transform .15s ease}
  .principal::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.32)}
  .principal .barra{position:relative;font-weight:800;font-size:1.4rem;letter-spacing:-.2px;text-align:center;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .principal .barra small{display:block;font-weight:500;font-size:.85rem;color:rgba(255,255,255,.88);margin-top:4px;letter-spacing:0}
  .principal::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);
    animation:brillo 3.5s ease-in-out infinite}
  @keyframes brillo{0%,55%{left:-60%}100%{left:130%}}
  .principal:active{transform:scale(.97)}

  /* Botones secundarios: cristal */
  .boton{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 18px 12px 12px;border-radius:20px;
    background:var(--cristal);border:1px solid var(--borde);color:var(--crema);text-decoration:none;
    font-weight:600;font-size:1rem;text-align:left;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .18s ease, background .18s ease}
  .boton:hover{background:rgba(60,12,20,.55)}
  .boton:active{transform:scale(.97)}
  .icono{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(255,240,230,.10)}
  .icono svg{width:22px;height:22px}
  .texto{flex:1;line-height:1.25}
  .texto small{display:block;color:var(--suave);font-size:.8rem;font-weight:400;margin-top:3px}
  .flecha{color:var(--suave);font-size:1.3rem}
  a:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

  .entra{opacity:0;transform:translateY(14px);animation:entrar .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes entrar{to{opacity:1;transform:none}}

  footer{margin-top:40px;color:var(--suave);font-size:.78rem}
  footer .c{color:var(--rojo-claro)}

  dialog{margin:auto;border:1px solid var(--borde);border-radius:22px;background:#260a10;color:var(--crema);
    padding:28px 22px;max-width:340px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  dialog::backdrop{background:rgba(10,2,4,.7);backdrop-filter:blur(6px)}
  dialog h2{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:1.35rem;margin-bottom:8px}
  dialog p{color:var(--suave);font-size:.92rem;line-height:1.45}
  .acciones{display:flex;gap:10px;margin-top:22px}
  .acciones button{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--borde);background:transparent;
    color:var(--crema);font:inherit;font-weight:700;cursor:pointer}
  .acciones .si{background:#fff;color:#111;border:none}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .entra{opacity:1;transform:none}
    .corazones{display:none}
  }
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<div class="velo" aria-hidden="true"></div>
<div class="corazones" id="corazones" aria-hidden="true"></div>

<main>
  <div class="aro entra" style="animation-delay:0s;animation-duration:.4s"><img src="foto.jpg" alt="Foto de Elena Alexis" width="124" height="124"></div>
  <h1 id="nombre" class="entra" style="animation-delay:.05s;animation-duration:.4s"></h1>
  <div class="estado entra" id="estado" style="animation-delay:.1s;animation-duration:.4s"></div>
  <p class="frase entra" id="frase" style="animation-delay:.15s;animation-duration:.4s"></p>
  <ul class="enlaces" id="enlaces"></ul>
  <footer class="entra" style="animation-delay:1.2s">Hecho con <span class="c">♥</span> · © <span id="anio"></span> Elena Alexis</footer>
</main>

<dialog id="aviso">
  <h2>¿Tienes 18 años o más?</h2>
  <p>Confirma tu edad para continuar.</p>
  <div class="acciones">
    <button type="button" id="no">No</button>
    <button type="button" class="si" id="si">Sí, entrar</button>
  </div>
</dialog>

<script>
/* ===========================================================
   ✏️  AQUÍ CAMBIAS TUS DATOS Y ENLACES  ✏️
   - online: true  → sale el puntito verde «En línea». Ponlo en false cuando no estés.
   - ubicacion: dónde estás tú (o "" para no mostrar nada).
   - responde: frase sobre cuándo sueles contestar (o "" para no mostrarla).
   - Para AÑADIR un enlace: copia una línea { ... }, pégala y cambia el texto y la dirección.
   - Para QUITAR un enlace: borra su línea entera.
   - principal: true → el botón grande con foto (solo uno). foto: el archivo de la foto que sale en él.
   - icono: "telegram", "regalo", "instagram", "tiktok", "youtube", "email" o un emoji.
   - Esta es la web para la biografía de Instagram (sin OnlyFans). La de elenalexis17.com está en la carpeta mi-web.
   =========================================================== */
const perfil = {
  nombre:    "Elena Alexis",
  frase:     "Hablamos? 💙",
  online:    true,
  ubicacion: "España",
  responde:  "Suelo responder rápido"
};

const enlaces = [
  { texto: "Más de mí →", detalle: "Únete a mi canal de Telegram", url: "https://telegram.me/+Wgp5ToPDj1JiYWFk", principal: true, foto: "masdemi.jpg" },
  { icono: "regalo",   texto: "Si quieres hacerme un regalito", detalle: "Mi lista de deseos de Amazon", url: "https://www.amazon.es/hz/wishlist/ls/DULX8FOIW38K?ref_=wl_share" },
];
/* ====== A partir de aquí no hace falta tocar nada ====== */

const ICONOS = {
  telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 3.6 2.9 10.8c-1 .4-1 1.8.1 2.1l4.6 1.4 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.7 4.7 3.5c.8.6 1.9.1 2.1-.9l3-15.2c.2-1.1-.9-2-1.9-1.6zM9.6 14.2l8.6-7.7-6.7 9.2-.3 3-1.6-4.5z"/></svg>',
  regalo:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  tiktok:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 2.2 1.6 3.8 3.9 4v3.1c-1.4.1-2.7-.3-3.9-1v6.1c0 3.9-3.2 6.3-6.5 5.7-4.3-.8-5.6-6.3-2.4-8.8 1.2-.9 2.6-1.2 4.1-1v3.2c-.5-.1-1-.2-1.5 0-1.6.5-1.8 2.7-.3 3.5 1.3.7 3-.2 3-1.9V3h3.6z"/></svg>',
  youtube:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.2c-.2-1.5-1-2.5-2.5-2.7C17.2 5.2 12 5.2 12 5.2s-5.2 0-7.5.3C3 5.7 2.2 6.7 2 8.2 1.8 9.5 1.8 12 1.8 12s0 2.5.2 3.8c.2 1.5 1 2.5 2.5 2.7 2.3.3 7.5.3 7.5.3s5.2 0 7.5-.3c1.5-.2 2.3-1.2 2.5-2.7.2-1.3.2-3.8.2-3.8s0-2.5-.2-3.8zM10 15.1V8.9l5.2 3.1L10 15.1z"/></svg>',
  email:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
};
const SVG_SITIO = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>';
const SVG_RELOJ = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6 3.2 1.9-.8 1.3L11.5 13.4V7h1.5v5.6z"/></svg>';

document.getElementById("nombre").textContent = perfil.nombre;
document.getElementById("frase").textContent = perfil.frase;
document.getElementById("anio").textContent = new Date().getFullYear();

const estado = document.getElementById("estado");
function trozo(html, txt){ const s=document.createElement("span"); s.innerHTML=html; s.append(txt); estado.appendChild(s); }
if (perfil.online) trozo('<i class="punto"></i>', "En línea");
if (perfil.ubicacion) trozo(SVG_SITIO, perfil.ubicacion);
if (perfil.responde) trozo(SVG_RELOJ, perfil.responde);

const lista = document.getElementById("enlaces");
const aviso = document.getElementById("aviso");
let pendiente = null;

enlaces.forEach((e, i) => {
  if (!e.url) return;
  const li = document.createElement("li");
  li.className = "entra";
  li.style.animationDelay = (0.5 + i * 0.2) + "s";
  const a = document.createElement("a");
  a.href = e.url; a.target = "_blank"; a.rel = "noopener";
  if (e.principal) {
    a.className = "principal";
    if (e.foto) a.style.backgroundImage = "url(" + e.foto + ")";
    const t = document.createElement("span"); t.className = "barra"; t.textContent = e.texto;
    if (e.detalle) { const s = document.createElement("small"); s.textContent = e.detalle; t.appendChild(s); }
    a.appendChild(t);
  } else {
    a.className = "boton";
    a.innerHTML = '<span class="icono" aria-hidden="true"></span><span class="texto"></span><span class="flecha" aria-hidden="true">›</span>';
    const ic = a.querySelector(".icono");
    if (ICONOS[e.icono]) ic.innerHTML = ICONOS[e.icono]; else ic.textContent = e.icono || "🔗";
    const t = a.querySelector(".texto"); t.textContent = e.texto;
    if (e.detalle) { const s = document.createElement("small"); s.textContent = e.detalle; t.appendChild(s); }
  }
  if (e.mas18) a.addEventListener("click", ev => { ev.preventDefault(); pendiente = e.url; aviso.showModal(); });
  li.appendChild(a); lista.appendChild(li);
});

document.getElementById("si").onclick = () => { aviso.close(); if (pendiente) window.open(pendiente, "_blank", "noopener"); };
document.getElementById("no").onclick = () => aviso.close();

/* Corazones flotando de fondo */
const caja = document.getElementById("corazones");
for (let i = 0; i < 12; i++) {
  const s = document.createElement("span");
  s.textContent = "♥";
  s.style.left = (Math.random() * 100) + "%";
  s.style.fontSize = (10 + Math.random() * 16) + "px";
  s.style.animationDuration = (12 + Math.random() * 12) + "s";
  s.style.animationDelay = (-Math.random() * 20) + "s";
  caja.appendChild(s);
}
</script>
</body>
</html>
